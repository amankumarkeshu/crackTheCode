<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" font-family="'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive" font-size="15">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="36" fill="#1f2937" font-size="20" font-weight="bold">URL Shortener  Write Path</text>

  <!-- Step 1 Client -->
  <g filter="url(#rough)">
    <rect x="20" y="120" width="120" height="70" rx="12" stroke="#1f2937" stroke-width="2.5" fill="#dbeafe"/>
  </g>
  <text x="55" y="160" fill="#1e3a8a" font-weight="bold">Client</text>

  <!-- Step 2 API GW -->
  <g filter="url(#rough)">
    <rect x="180" y="120" width="140" height="70" rx="12" stroke="#1f2937" stroke-width="2.5" fill="#ede9fe"/>
  </g>
  <text x="205" y="160" fill="#4c1d95" font-weight="bold">API Gateway</text>

  <!-- Step 3 Shorten Service (center) -->
  <g filter="url(#rough)">
    <rect x="360" y="100" width="180" height="110" rx="14" stroke="#1f2937" stroke-width="3" fill="#e0e7ff"/>
  </g>
  <text x="390" y="140" fill="#312e81" font-weight="bold">Shorten Service</text>
  <text x="385" y="165" fill="#1e1b4b" font-size="13">1. get next ID</text>
  <text x="385" y="183" fill="#1e1b4b" font-size="13">2. encode ’ base62</text>
  <text x="385" y="201" fill="#1e1b4b" font-size="13">3. validate URL</text>

  <!-- Sequence Service (above) -->
  <g filter="url(#rough)">
    <rect x="380" y="0" width="140" height="60" rx="12" stroke="#1f2937" stroke-width="2.5" fill="#fce7f3"/>
  </g>
  <text x="395" y="35" fill="#831843" font-weight="bold">Sequence Svc</text>
  <text x="405" y="52" fill="#9d174d" font-size="12">Snowflake / ZK</text>

  <!-- DB (right of shorten) -->
  <g filter="url(#rough)">
    <ellipse cx="700" cy="155" rx="90" ry="50" stroke="#1f2937" stroke-width="2.5" fill="#d1fae5"/>
  </g>
  <text x="665" y="150" fill="#065f46" font-weight="bold">Postgres /</text>
  <text x="665" y="170" fill="#065f46" font-weight="bold">DynamoDB</text>

  <!-- Redis warm (top right) -->
  <g filter="url(#rough)">
    <rect x="610" y="0" width="170" height="60" rx="12" stroke="#1f2937" stroke-width="2.5" fill="#fef3c7"/>
  </g>
  <text x="635" y="35" fill="#78350f" font-weight="bold">Redis (warm)</text>
  <text x="640" y="52" fill="#92400e" font-size="12">optional, hot keys</text>

  <!-- 201 response box (far right) -->
  <g filter="url(#rough)">
    <rect x="860" y="120" width="210" height="70" rx="12" stroke="#1f2937" stroke-width="2.5" fill="#fef9c3"/>
  </g>
  <text x="900" y="150" fill="#713f12" font-weight="bold">201 Created</text>
  <text x="880" y="172" fill="#854d0e" font-size="13">{shortUrl: "ck/abc"}</text>

  <!-- Arrows -->
  <line x1="140" y1="155" x2="180" y2="155" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#rough)"/>
  <line x1="320" y1="155" x2="360" y2="155" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#rough)"/>
  <line x1="540" y1="155" x2="610" y2="155" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="552" y="148" fill="#1f2937" font-size="12">INSERT</text>
  <line x1="790" y1="155" x2="860" y2="155" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#rough)"/>

  <!-- Up to Sequence Service -->
  <line x1="430" y1="100" x2="430" y2="60" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="440" y="85" fill="#1f2937" font-size="12">next id</text>

  <!-- DB ’ Redis warm -->
  <path d="M695 105 Q695 60 695 60" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="700" y="90" fill="#1f2937" font-size="12">warm</text>

  <!-- Return arrow back to client -->
  <path d="M860 165 Q435 280 80 200" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="450" y="295" fill="#059669" font-size="13">response ’ client</text>
</svg>
