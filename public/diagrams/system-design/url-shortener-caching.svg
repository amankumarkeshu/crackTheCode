<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .cache-l1 { fill: #EF4444; stroke: #DC2626; stroke-width: 2; }
      .cache-l2 { fill: #F59E0B; stroke: #D97706; stroke-width: 2; }
      .cache-l3 { fill: #10B981; stroke: #059669; stroke-width: 2; }
      .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .stats { font-family: Arial, sans-serif; font-size: 11px; fill: #6B7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Multi-Level Caching Strategy</text>
  
  <!-- Request Flow -->
  <rect x="50" y="80" width="80" height="50" rx="10" fill="#6B7280" stroke="#374151" stroke-width="2"/>
  <text x="90" y="110" class="label" text-anchor="middle">Client Request</text>
  
  <!-- L1 Cache (Application) -->
  <rect x="200" y="80" width="120" height="50" rx="10" class="cache-l1"/>
  <text x="260" y="100" class="label" text-anchor="middle">L1: Application Cache</text>
  <text x="260" y="115" class="stats" text-anchor="middle">In-Memory | 1ms | 95% hit</text>
  
  <!-- L2 Cache (Redis) -->
  <rect x="400" y="80" width="120" height="50" rx="10" class="cache-l2"/>
  <text x="460" y="100" class="label" text-anchor="middle">L2: Redis Cluster</text>
  <text x="460" y="115" class="stats" text-anchor="middle">Distributed | 5ms | 85% hit</text>
  
  <!-- L3 Database -->
  <ellipse cx="650" cy="105" rx="80" ry="35" class="cache-l3"/>
  <text x="650" y="100" class="label" text-anchor="middle">L3: Database</text>
  <text x="650" y="115" class="stats" text-anchor="middle">PostgreSQL | 50ms | 100% hit</text>
  
  <!-- Arrows with labels -->
  <line x1="130" y1="105" x2="190" y2="105" class="arrow"/>
  <text x="160" y="100" class="label" text-anchor="middle">1</text>
  
  <line x1="320" y1="105" x2="390" y2="105" class="arrow"/>
  <text x="355" y="100" class="label" text-anchor="middle">2</text>
  
  <line x1="520" y1="105" x2="570" y2="105" class="arrow"/>
  <text x="545" y="100" class="label" text-anchor="middle">3</text>
  
  <!-- Cache Population (reverse arrows) -->
  <line x1="570" y1="125" x2="520" y2="125" class="arrow"/>
  <line x1="390" y1="125" x2="320" y2="125" class="arrow"/>
  <line x1="190" y1="125" x2="130" y2="125" class="arrow"/>
  
  <!-- Cache Strategy Details -->
  <rect x="50" y="200" width="700" height="250" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="70" y="230" class="title">Caching Strategy Details</text>
  
  <!-- L1 Details -->
  <rect x="70" y="250" width="200" height="120" rx="5" class="cache-l1" fill-opacity="0.1"/>
  <text x="80" y="270" class="label" font-weight="bold">L1: Application Cache</text>
  <text x="80" y="290" class="stats">" HashMap in application memory</text>
  <text x="80" y="305" class="stats">" LRU eviction policy</text>
  <text x="80" y="320" class="stats">" 10,000 most popular URLs</text>
  <text x="80" y="335" class="stats">" 95% hit rate for hot URLs</text>
  <text x="80" y="350" class="stats">" &lt;1ms lookup time</text>
  
  <!-- L2 Details -->
  <rect x="300" y="250" width="200" height="120" rx="5" class="cache-l2" fill-opacity="0.1"/>
  <text x="310" y="270" class="label" font-weight="bold">L2: Redis Cluster</text>
  <text x="310" y="290" class="stats">" Distributed hash table</text>
  <text x="310" y="305" class="stats">" TTL: 1 hour for hot URLs</text>
  <text x="310" y="320" class="stats">" 1M URLs cached</text>
  <text x="310" y="335" class="stats">" 85% hit rate overall</text>
  <text x="310" y="350" class="stats">" 5ms network + lookup</text>
  
  <!-- L3 Details -->
  <rect x="530" y="250" width="200" height="120" rx="5" class="cache-l3" fill-opacity="0.1"/>
  <text x="540" y="270" class="label" font-weight="bold">L3: Database (Source of Truth)</text>
  <text x="540" y="290" class="stats">" PostgreSQL with sharding</text>
  <text x="540" y="305" class="stats">" Read replicas for analytics</text>
  <text x="540" y="320" class="stats">" All URLs stored permanently</text>
  <text x="540" y="335" class="stats">" 100% accuracy guaranteed</text>
  <text x="540" y="350" class="stats">" 50ms average query time</text>
  
  <!-- Performance Metrics -->
  <text x="70" y="410" class="title">Cache Performance Impact</text>
  <text x="70" y="430" class="stats">" Overall cache hit rate: 92% (95% × 0.2 + 85% × 0.8)</text>
  <text x="70" y="445" class="stats">" Average response time: 8ms (1ms × 0.95 + 5ms × 0.04 + 50ms × 0.01)</text>
  <text x="70" y="460" class="stats">" Database load reduction: 92% fewer queries to main database</text>
  
</svg>