<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .label { font-family: Arial, sans-serif; font-size: 14px; }
      .component { fill: #3B82F6; stroke: #1E40AF; stroke-width: 2; }
      .database { fill: #10B981; stroke: #059669; stroke-width: 2; }
      .cache { fill: #F59E0B; stroke: #D97706; stroke-width: 2; }
      .user { fill: #6B7280; stroke: #374151; stroke-width: 2; }
      .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">URL Shortener - High Level Architecture</text>
  
  <!-- Users -->
  <circle cx="100" cy="100" r="30" class="user"/>
  <text x="100" y="105" class="label" text-anchor="middle">Users</text>
  
  <!-- Load Balancer -->
  <rect x="250" y="70" width="120" height="60" rx="10" class="component"/>
  <text x="310" y="105" class="label" text-anchor="middle">Load Balancer</text>
  
  <!-- Application Servers -->
  <rect x="450" y="50" width="100" height="40" rx="5" class="component"/>
  <text x="500" y="75" class="label" text-anchor="middle">App Server 1</text>
  
  <rect x="450" y="110" width="100" height="40" rx="5" class="component"/>
  <text x="500" y="135" class="label" text-anchor="middle">App Server 2</text>
  
  <!-- Cache Layer -->
  <rect x="650" y="70" width="100" height="60" rx="10" class="cache"/>
  <text x="700" y="95" class="label" text-anchor="middle">Redis</text>
  <text x="700" y="115" class="label" text-anchor="middle">Cache</text>
  
  <!-- Database -->
  <ellipse cx="500" cy="280" rx="80" ry="40" class="database"/>
  <text x="500" y="275" class="label" text-anchor="middle">URL Database</text>
  <text x="500" y="295" class="label" text-anchor="middle">(Sharded)</text>
  
  <!-- Analytics DB -->
  <ellipse cx="650" cy="280" rx="80" ry="40" class="database"/>
  <text x="650" y="275" class="label" text-anchor="middle">Analytics DB</text>
  <text x="650" y="295" class="label" text-anchor="middle">(Time-series)</text>
  
  <!-- CDN -->
  <rect x="250" y="180" width="120" height="50" rx="25" class="cache"/>
  <text x="310" y="210" class="label" text-anchor="middle">CDN</text>
  
  <!-- Arrows -->
  <line x1="130" y1="100" x2="240" y2="100" class="arrow"/>
  <line x1="370" y1="100" x2="440" y2="70" class="arrow"/>
  <line x1="370" y1="100" x2="440" y2="130" class="arrow"/>
  
  <line x1="550" y1="70" x2="640" y2="90" class="arrow"/>
  <line x1="550" y1="130" x2="640" y2="110" class="arrow"/>
  
  <line x1="500" y1="150" x2="500" y2="240" class="arrow"/>
  <line x1="520" y1="150" x2="630" y2="240" class="arrow"/>
  
  <line x1="310" y1="130" x2="310" y2="170" class="arrow"/>
  
  <!-- Flow Labels -->
  <text x="185" y="95" class="label">HTTP Request</text>
  <text x="520" y="200" class="label">DB Queries</text>
  <text x="580" y="95" class="label">Cache Lookup</text>
  
  <!-- Traffic Numbers -->
  <text x="50" y="500" class="label">Traffic: 36,000 reads/sec, 3,600 writes/sec</text>
  <text x="50" y="520" class="label">Storage: 365TB (5 years), 200GB/day</text>
  <text x="50" y="540" class="label">Cache: 85% hit rate, sub-ms latency</text>
  
</svg>