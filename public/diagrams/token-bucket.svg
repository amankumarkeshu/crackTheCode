<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive" font-size="18">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Refill drip -->
  <text x="40" y="60" fill="#1f2937">refill 1 token / sec</text>
  <path d="M150 70 q15 30 0 60 q-15 30 0 60 q15 30 0 60" stroke="#0ea5e9" stroke-width="3" fill="none" filter="url(#rough)"/>
  <path d="M150 250 l-8 -12 l16 0 z" fill="#0ea5e9"/>

  <!-- Bucket -->
  <path d="M210 90 L210 320 Q210 360 280 360 L380 360 Q450 360 450 320 L450 90 Z"
    stroke="#1f2937" stroke-width="3" fill="#fef3c7" filter="url(#rough)"/>
  <text x="290" y="80" fill="#1f2937" font-size="20" font-weight="bold">Token Bucket</text>
  <text x="295" y="385" fill="#6b7280" font-size="14">capacity = 10</text>

  <!-- Tokens stacked -->
  <g filter="url(#rough)">
    <circle cx="260" cy="330" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="295" cy="330" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="330" cy="330" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="365" cy="330" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="400" cy="330" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="275" cy="300" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="310" cy="300" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="345" cy="300" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="380" cy="300" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
  </g>

  <!-- Request arrows -->
  <line x1="490" y1="200" x2="620" y2="200" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="510" y="190" fill="#1f2937">take 1</text>

  <!-- Allowed box -->
  <rect x="630" y="120" width="220" height="80" rx="14" stroke="#059669" stroke-width="3" fill="#d1fae5" filter="url(#rough)"/>
  <text x="690" y="170" fill="#065f46" font-size="22" font-weight="bold">200 OK</text>

  <!-- Denied box -->
  <rect x="630" y="240" width="220" height="80" rx="14" stroke="#dc2626" stroke-width="3" fill="#fee2e2" filter="url(#rough)"/>
  <text x="660" y="290" fill="#991b1b" font-size="22" font-weight="bold">429 denied</text>

  <!-- Branch labels -->
  <text x="540" y="155" fill="#059669">tokens &gt; 0</text>
  <text x="540" y="270" fill="#dc2626">tokens = 0</text>

  <!-- Bucket ’ branches -->
  <path d="M450 230 Q540 230 630 160" stroke="#059669" stroke-width="2.5" fill="none" stroke-dasharray="6 4" filter="url(#rough)"/>
  <path d="M450 250 Q540 250 630 280" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-dasharray="6 4" filter="url(#rough)"/>
</svg>
